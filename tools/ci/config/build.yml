variables:
  BOT_TRIGGER_TEST:
    description: "Set a non-empty value to run build_ssc_esp32."

build_ssc_esp32:
  stage: build
  image: $CI_REGISTRY/ci/images/idf-ubuntu24-python3.11:1
  variables:
    IDF_PATH: "$CI_PROJECT_DIR/esp-idf"
    MAKEFLAGS: "-j8"
    SSC_BRANCH: "master"
    IDF_BRANCH: "master"
    board: "esp32"
  tags:
    - build
    - shiny

  artifacts:
    paths:
     - ${board}-${CI_PIPELINE_ID}.debug.tar.gz
    expire_in: 1 week
  
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $BOT_TRIGGER_TEST != ""

  before_script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -n $GITLAB_KEY > ~/.ssh/id_rsa_base64
    - base64 --decode --ignore-garbage ~/.ssh/id_rsa_base64 > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host gitlab.espressif.cn\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config

  script:
    - rm -rf /tmp/esp_coex_lib
    - mkdir /tmp/esp_coex_lib
    - cp -rf * /tmp/esp_coex_lib
    - if git ls-remote ${GITLAB_SSH_SERVER}/espressif/esp-idf.git | grep -sw "${CI_COMMIT_REF_NAME}" >/dev/null 2>&1; then IDF_BRANCH=${CI_COMMIT_REF_NAME}; fi
    - if [[ "${BOT_CUSTOMIZED_REVISION}" ]] && [[ "$BOT_CUSTOMIZED_REVISION" == *"esp-idf"* ]]; then IDF_BRANCH=$(python -c 'import os;print eval(os.environ["BOT_CUSTOMIZED_REVISION"])["esp-idf"]'); fi
    - echo "Cloning esp-idf - ${IDF_BRANCH} ..."
    - git clone --depth=1 --single-branch -b "$IDF_BRANCH" --dissociate ${GITLAB_SSH_SERVER}/espressif/esp-idf.git
    - cd esp-idf
    - coex_lib_path=`grep -B 1 esp-coex-lib .gitmodules | grep path | cut -d' ' -f3`
    - cd $CI_PROJECT_DIR
    - git -C esp-idf submodule update --init --recursive --depth=1
    - rm -rf esp-idf/$coex_lib_path/*
    - cp -rf /tmp/esp_coex_lib/* esp-idf/$coex_lib_path/.
    - if [[ "${BOT_CUSTOMIZED_REVISION}" ]] && [[ "$BOT_CUSTOMIZED_REVISION" == *"ssc"* ]]; then SSC_BRANCH=$(python -c 'import os;print eval(os.environ["BOT_CUSTOMIZED_REVISION"])["ssc"]') ; fi
    - echo Cloning SSC - ${SSC_BRANCH} ...
    - git clone --depth=1 --recursive --single-branch -b $SSC_BRANCH --dissociate ${GITLAB_SSH_SERVER}/yinling/SSC.git
    - chmod +x tools/ci/build_app.sh
    - ./tools/ci/build_app.sh
